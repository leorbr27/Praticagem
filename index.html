<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f33"><title>Manobras Previstas | Praticagem ES</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:16px}.header{background:#0b1f33;color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}h1{margin:0 0 5px;font-size:24px}.sub{margin:0;color:#cbd7e2;font-size:14px}.toolbar{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 3px 15px #0000000b}input,button{font:inherit}input{flex:1;min-width:220px;padding:12px;border:1px solid #ccd5dd;border-radius:10px}button{border:0;border-radius:10px;padding:12px 16px;background:#0b1f33;color:#fff;font-weight:700}.meta{font-size:12px;color:#687684;margin-left:auto}.table-wrap{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 3px 15px #0000000b}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f2;font-size:14px;white-space:nowrap}th{background:#eef3f7;color:#344454;font-size:12px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}tbody tr:hover{background:#f8fafc}.status{font-weight:700}.empty{text-align:center;padding:35px;color:#687684}.source{font-size:12px;color:#74818c;text-align:center;margin:14px}.error{color:#9b2c2c;background:#fff0f0;border:1px solid #f0caca;border-radius:10px;padding:12px;margin-bottom:14px;display:none}@media(max-width:600px){.wrap{padding:10px}.header{padding:18px}.toolbar{align-items:stretch}.meta{width:100%;margin-left:0}h1{font-size:21px}}</style></head><body><main class="wrap"><section class="header"><h1>🚢 Manobras Previstas</h1><p class="sub">Programação de manobras da Praticagem Espírito Santo</p></section><section class="toolbar"><input id="filter" placeholder="🔎 Filtrar por navio, porto, berço ou situação"><button id="refresh">Atualizar</button><span class="meta" id="meta">Carregando...</span></section><div class="error" id="error"></div><section class="table-wrap"><table><thead><tr><th>Navio</th><th>Data</th><th>Hora</th><th>Porto</th><th>Berço</th><th>Situação</th></tr></thead><tbody id="body"><tr><td colspan="6" class="empty">Carregando manobras...</td></tr></tbody></table></section><p class="source">Fonte: <a href="https://www.praticagem.org.br/manobras-previstas.html" target="_blank" rel="noopener">Praticagem Espírito Santo</a>.</p></main><script>const body=document.getElementById("body"),filter=document.getElementById("filter"),meta=document.getElementById("meta"),error=document.getElementById("error");let rows=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function render(){const q=filter.value.trim().toLocaleLowerCase("pt-BR");const data=rows.filter(r=>!q||Object.values(r).join(" ").toLocaleLowerCase("pt-BR").includes(q));body.innerHTML=data.length?data.map(r=>"<tr><td><strong>"+esc(r.navio)+"</strong></td><td>"+esc(r.data)+"</td><td>"+esc(r.hora)+"</td><td>"+esc(r.porto)+"</td><td>"+esc(r.berco)+"</td><td class='status'>"+esc(r.situacao)+"</td></tr>").join(""):"<tr><td colspan='6' class='empty'>"+(rows.length?"Nenhuma manobra encontrada para o filtro.":"Nenhuma manobra disponível.")+"</td></tr>";meta.textContent=data.length+" de "+rows.length+" manobra(s)"}async function load(){error.style.display="none";meta.textContent="Atualizando...";try{const r=await fetch("manobras.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Arquivo de dados indisponível.");const j=await r.json();rows=Array.isArray(j.manobras)?j.manobras:[];render();const d=j.atualizado_em?new Date(j.atualizado_em):null;meta.textContent=(d&&!isNaN(d)?"Atualizado "+d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+" • ":"")+rows.length+" manobra(s)"}catch(e){body.innerHTML="<tr><td colspan='6' class='empty'>Não foi possível carregar as manobras.</td></tr>";error.textContent=e.message;error.style.display="block";meta.textContent="Erro ao atualizar"}}filter.addEventListener("input",render);document.getElementById("refresh").onclick=load;load();setInterval(load,300000);</script></body></html>
