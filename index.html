<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="praticagem-build" content="2026-10-01-1225">
<title>Manobras Previstas | Praticagem ES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:12px}
header{display:flow-root;background:#0b1f33;color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
h1{margin:0 0 4px;font-size:22px}.sub{margin:0;color:#cbd7e2;font-size:13px}
.analysis-link{float:right;display:inline-flex;align-items:center;justify-content:center;min-height:38px;margin-top:0;padding:8px 14px;border-radius:10px;background:#fff;color:#0b1f33;text-decoration:none;font-size:14px;font-weight:700}
.filters{background:#fff;border-radius:14px;padding:10px;margin-bottom:12px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:8px;box-shadow:0 2px 12px #0000000a}
input,select,button{font:inherit;min-height:42px;border-radius:10px;border:1px solid #ccd5dd;padding:9px 11px}
button{background:#0b1f33;color:#fff;border:0;font-weight:700}
.meta{font-size:12px;color:#687684;margin:9px 2px}
.table-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 2px 12px #0000000a}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf0f2;white-space:nowrap;font-size:14px}
th{background:#eef3f7;color:#344454;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr.status-marcada td{background:#dcfce7}
tr.status-iniciada td{background:#fef3c7}
tr.status-impedida td{background:#fee2e2}
tr.status-marcada:hover td{background:#bbf7d0}
tr.status-iniciada:hover td{background:#fde68a}
tr.status-impedida:hover td{background:#fecaca}
.empty{text-align:center;padding:32px;color:#687684}
footer{text-align:center;color:#74818c;font-size:11px;padding:12px 4px}
@media(max-width:720px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>🚢 Manobras Previstas</h1><p class="sub">Praticagem Espírito Santo · berços monitorados</p><a class="analysis-link" href="analise.html">Análise</a></header>
<section class="filters">
<input id="busca" type="search" placeholder="🔎 Navio ou berço" autocomplete="off">
<select id="tipo"><option value="">Todos os tipos</option><option value="ENTRADA">Entrada</option><option value="SAIDA">Saída</option><option value="MANOBRA">Manobra</option></select>
<select id="situacao"><option value="">Todas as situações</option><option value="PREVISTA">Prevista</option><option value="MARCADA">Marcada</option><option value="INICIADA">Iniciada</option><option value="IMPEDIDA">Barra impedida</option><option value="CANCELADA">Cancelada</option></select>
<select id="porto"><option value="">Todos os portos</option></select>
<button id="atualizar" type="button">Atualizar</button>
</section>
<div class="meta" id="meta">Carregando...</div>
<section class="table-wrap"><table>
<thead><tr><th>Nome do navio</th><th>Data</th><th>Hora</th><th>Tipo</th><th>Porto</th><th>Berço</th><th>Situação</th></tr></thead>
<tbody id="tabela"><tr><td colspan="7" class="empty">Carregando...</td></tr></tbody>
</table></section>
<footer id="rodape">Fonte: Praticagem Espírito Santo · Última atualização: —</footer>
<div id="ultimoCommitGitHub" style="text-align:center;color:#74818c;font-size:11px;padding:4px 4px 12px">Último commit do GitHub: consultando…</div>
<script>
(async function mostrarUltimoCommitGitHub(){
 const elemento=document.getElementById("ultimoCommitGitHub");
 try{
  const resposta=await fetch("https://api.github.com/repos/leorbr27/Praticagem/commits/main",{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
  if(!resposta.ok)throw new Error("HTTP "+resposta.status);
  const commit=await resposta.json();
  const data=commit.commit&&commit.commit.author&&commit.commit.author.date;
  if(!data)throw new Error("Data do commit indisponível");
  elemento.textContent="Último commit do GitHub: "+new Date(data).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
 }catch(erro){
  elemento.textContent="Último commit do GitHub: não foi possível consultar agora";
  console.error("Falha ao consultar último commit do GitHub:",erro);
 }
})();
</script>
</main>
<script>
const $=id=>document.getElementById(id);
let rows=[];
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function statusClass(s){const v=norm(s);if(v==="MARCADA")return "status-marcada";if(v==="INICIADA")return "status-iniciada";if(v.includes("BARRA")&&v.includes("IMPEDIDA")||v==="IMPEDIDA")return "status-impedida";return "";}
function preencherPortos(){
 const atual=$("porto").value;
 const portos=[...new Set(rows.map(r=>r.porto).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
 $("porto").innerHTML='<option value="">Todos os portos</option>'+portos.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join("");
 if(portos.includes(atual))$("porto").value=atual;
}
function render(){
 const q=norm($("busca").value).toLowerCase(),t=norm($("tipo").value),s=norm($("situacao").value),p=norm($("porto").value);
 const data=rows.filter(r=>{
  const texto=norm(r.navio+" "+r.berco).toLowerCase();
  return (!q||texto.includes(q))&&(!t||norm(r.tipo)===t)&&(!s||norm(r.situacao)===s)&&(!p||norm(r.porto)===p);
 });
 $("tabela").innerHTML=data.length?data.map(r=>'<tr class="'+statusClass(r.situacao)+'"><td><strong>'+esc(r.navio)+'</strong></td><td>'+esc(r.data)+'</td><td>'+esc(r.hora)+'</td><td>'+esc(r.tipo)+'</td><td>'+esc(r.porto)+'</td><td>'+esc(r.berco)+'</td><td><strong>'+esc(r.situacao)+'</strong></td></tr>').join(""):'<tr><td colspan="7" class="empty">Nenhuma manobra encontrada.</td></tr>';
 $("meta").innerHTML=data.length+" de "+rows.length+" manobra(s) monitorada(s)<br>Última atualização: "+(window.ultimaAtualizacao||"—");
}
const BERCOS_MONITORADOS=new Set(["VIX101","VIX102","VIX103","VIX201","VIX202","VIX203","VIX204","VIX206","VIX207","VIX905","VIX906","PRMPS1","PRMPS2","PRMPS3","RCH101","RCH102","RCH103","RCH501","RCH502","RCH503"]);
async function consultarFonte(){
 $("meta").textContent="Consultando diretamente o site da Praticagem...";
 try{
  const res=await fetch("https://www.praticagem.org.br/asp/previstas.asp",{cache:"no-store"});
  if(!res.ok)throw new Error("O site respondeu HTTP "+res.status+".");
  const html=await res.text();
  const dataPattern=/^\d{2}\/\d{2}\/\d{4}$/;
  const timePattern=/^\d{2}:\d{2}$/;
  const encontrados=[];
  const decode=document.createElement("textarea");
  const decodeHtml=s=>{decode.innerHTML=s;return decode.value;};
  const stripTags=s=>decodeHtml(s.replace(/<[^>]+>/g," "));
  const linhas=html.match(/<tr\b[^>]*>[\s\S]*?<\/tr\s*>/gi)||[];
  linhas.forEach(linha=>{
   const cells=(linha.match(/<t[dh]\b[^>]*>[\s\S]*?<\/t[dh]\s*>/gi)||[]).map(cell=>stripTags(cell).replace(/\s+/g," ").trim());
   const dateIndex=cells.findIndex(v=>dataPattern.test(v));
   if(dateIndex<0||dateIndex+4>=cells.length||!timePattern.test(cells[dateIndex+1]||""))return;
   const item={navio:cells[0],data:cells[dateIndex],hora:cells[dateIndex+1],tipo:cells[dateIndex+2],porto:cells[dateIndex+3],berco:cells[dateIndex+4],situacao:cells[cells.length-1]};
   const tokens=(item.berco.toUpperCase().match(/[A-Z0-9]+/g)||[]);
   if(item.navio&&item.berco&&item.situacao&&tokens.some(token=>BERCOS_MONITORADOS.has(token)))encontrados.push(item);
  });
  if(!encontrados.length)throw new Error("Nenhuma manobra monitorada foi encontrada na resposta do site.");
  rows=encontrados;
  preencherPortos();
  window.ultimaAtualizacao=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+" (consulta direta)";
  render();
  $("rodape").textContent="Fonte: Praticagem Espírito Santo · Dados consultados diretamente no site";
 }catch(e){
  render();
  $("meta").textContent="Não foi possível consultar diretamente a fonte. O navegador pode bloquear a requisição por CORS; os dados exibidos anteriormente foram mantidos.";
  $("rodape").textContent="Fonte: Praticagem Espírito Santo · Consulta direta indisponível";
  console.error("Falha na consulta direta à Praticagem:",e);
 }
}
async function carregar(){
 $("meta").textContent="Atualizando...";
 try{
  const res=await fetch("https://raw.githubusercontent.com/leorbr27/Praticagem/main/manobras.json?t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error();
  const json=await res.json(); rows=Array.isArray(json.manobras)?json.manobras:[];
  preencherPortos(); render();
  const d=json.atualizado_em?new Date(json.atualizado_em):null;
  window.ultimaAtualizacao=(d&&!isNaN(d) ? d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : "—");
  render();
  $("rodape").textContent="Fonte: Praticagem Espírito Santo";
  if(d&&!isNaN(d)&&Date.now()-d.getTime()>300000)await consultarFonte();
 }catch(e){
  rows=[];render();$("meta").textContent="Erro ao atualizar";$("rodape").textContent="Fonte: Praticagem Espírito Santo · Não foi possível atualizar";
 }
}
["busca","tipo","situacao","porto"].forEach(id=>$(id).addEventListener("input",render));
$("atualizar").addEventListener("click",async()=>{
 const botao=$("atualizar");
 botao.disabled=true;
 botao.textContent="Atualizando...";
 try{
  await consultarFonte();
 }finally{
  botao.disabled=false;
  botao.textContent="Atualizar";
 }
});
carregar();setInterval(carregar,300000);
</script>
</body>
</html>
