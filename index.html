<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praticagem ES</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
body{display:flex;align-items:flex-end;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#687684}
footer{width:100%;padding:14px 10px;text-align:center;font-size:12px;border-top:1px solid #e5e7eb;box-sizing:border-box}
</style>
</head>
<body>
<footer id="ultima-atualizacao">Última atualização do projeto: carregando...</footer>
<script>
const footer=document.getElementById("ultima-atualizacao");
const atualizadoEm="2026-10-01T12:00:49-03:00";
const data=new Date(atualizadoEm);
footer.textContent="Última atualização do projeto: "+data.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
</script>
</body>
</html>
