name: Build shipmonitor bundle
on:
  push:
    paths:
      - 'monitoramento/index.mjs'
      - 'monitoramento/package.json'
      - '.github/workflows/build-shipmonitor.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: monitoramento
        run: npm install --omit=dev
      - name: Bundle runtime dependencies
        working-directory: monitoramento
        run: |
          npx --yes esbuild index.mjs --bundle --platform=node --format=esm --packages=bundle --outfile=dist/index.mjs
          cd dist
          zip ../shipmonitor-bundle.zip index.mjs
      - name: Smoke test active Neon endpoints
        run: |
          node --input-type=module <<'NODE'
          const base = "https://br-bold-cloud-b4kwm09r-shipmonitor.compute.c-6.us-east-2.aws.neon.tech";
          for (const path of ["/health", "/vapid-public-key"]) {
            const response = await fetch(base + path, {
              headers: { Origin: "https://leorbr27.github.io" },
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.text();
            console.log(path + " => HTTP " + response.status + " " + body.slice(0, 500));
            if (!response.ok) process.exitCode = 1;
          }
          NODE
      - name: Commit generated bundle for Neon deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoramento/dist/index.mjs
          git commit -m "Build bundled shipmonitor backend" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: shipmonitor-bundle
          path: monitoramento/shipmonitor-bundle.zip
          if-no-files-found: error
          retention-days: 1
