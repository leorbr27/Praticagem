name: Atualizar manobras previstas
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "monitor.py"
      - ".github/workflows/monitor.yml"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler Praticagem Espírito Santo
        run: python3 monitor.py
      - name: Salvar dados
        run: |
          git config user.name "praticagem-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manobras.json
          git diff --cached --quiet || git commit -m "Atualizar manobras previstas"
          git push
