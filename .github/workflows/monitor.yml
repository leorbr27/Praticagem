name: Atualizar manobras previstas
# Execução automática: a cada 5 minutos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "monitor.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: praticagem-manobras
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coletar manobras da Praticagem ES
        run: python3 monitor.py
      - name: Atualizar manobras.json
        run: |
          git config user.name "praticagem-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manobras.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
            exit 0
          fi
          git commit -m "Atualizar manobras previstas"
          git push origin HEAD:main
