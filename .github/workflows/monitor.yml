name: Monitorar Praticagem

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Executar monitor
        run: python3 monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar estado
        run: |
          git config user.name "praticagem-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "Atualizar estado do monitor"
          git push
