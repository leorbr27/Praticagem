<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navios Atracados | Praticagem ES</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:12px}header{display:flow-root;background:#0b1f33;color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}h1{margin:0 0 4px;font-size:22px}.sub{margin:0;color:#cbd7e2;font-size:13px}.nav{float:right;display:inline-flex;align-items:center;justify-content:center;min-height:38px;margin-left:8px;padding:8px 14px;border-radius:10px;background:#fff;color:#0b1f33;text-decoration:none;font-size:14px;font-weight:700}.filters{background:#fff;border-radius:14px;padding:10px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:8px;box-shadow:0 2px 12px #0000000a}input,button{font:inherit;min-height:42px;border-radius:10px;border:1px solid #ccd5dd;padding:9px 11px}button{background:#0b1f33;color:#fff;border:0;font-weight:700}.meta{font-size:12px;color:#687684;margin:9px 2px}.table-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 2px 12px #0000000a}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf0f2;white-space:nowrap;font-size:14px}th{background:#eef3f7;color:#344454;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}.empty{text-align:center;padding:32px;color:#687684}footer{text-align:center;color:#74818c;font-size:11px;padding:12px 4px}@media(max-width:720px){header{display:flex;flex-direction:column}.nav{float:none;order:2;margin:8px 0 0}h1{order:0}.sub{order:1}.filters{grid-template-columns:1fr}}
</style>
</head><body><main class="wrap">
<header><a class="nav" href="index.html">Manobras previstas</a><h1>⚓ Navios Atracados</h1><p class="sub">Navios atracados nos portos e berços monitorados</p></header>
<section class="filters"><input id="busca" type="search" placeholder="🔎 Buscar navio, porto ou berço" autocomplete="off"><button id="atualizar" type="button">Atualizar</button></section>
<div class="meta" id="meta">Consultando Praticagem Espírito Santo...</div>
<section class="table-wrap"><table><thead><tr><th>Nome do navio</th><th>Data</th><th>Hora</th><th>Tipo</th><th>Porto</th><th>Berço</th><th>Situação</th></tr></thead><tbody id="tabela"><tr><td colspan="7" class="empty">Carregando...</td></tr></tbody></table></section>
<footer id="rodape">Fonte: Praticagem Espírito Santo · <a href="https://www.praticagem.org.br/navios-atracados.html" target="_blank" rel="noopener">abrir fonte original</a></footer>
<div id="ultimoCommitGitHub" style="text-align:center;color:#74818c;font-size:11px;padding:4px 4px 12px">Último commit do GitHub: consultando…</div>
<script>
(async()=>{const el=document.getElementById("ultimoCommitGitHub");try{const r=await fetch("https://api.github.com/repos/leorbr27/Praticagem/commits/main",{cache:"no-store"});if(!r.ok)throw Error();const j=await r.json();el.textContent="Último commit do GitHub: "+new Date(j.commit.author.date).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){el.textContent="Último commit do GitHub: não foi possível consultar agora"}})();
const $=id=>document.getElementById(id), norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim(), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const BERCOS=new Set(["VIX101","VIX102","VIX103","VIX201","VIX202","VIX203","VIX204","VIX206","VIX207","VIX905","VIX906","PRMPS1","PRMPS2","PRMPS3","RCH101","RCH102","RCH103","RCH501","RCH502","RCH503"]);
let rows=[];
function render(){const q=norm($("busca").value);const data=rows.filter(r=>norm([r.navio,r.porto,r.berco].join(" ")).includes(q));$("tabela").innerHTML=data.length?data.map(r=>'<tr><td><strong>'+esc(r.navio)+'</strong></td><td>'+esc(r.data||"—")+'</td><td>'+esc(r.hora||"—")+'</td><td>'+esc(r.tipo||"—")+'</td><td>'+esc(r.porto||"—")+'</td><td>'+esc(r.berco||"—")+'</td><td><strong>'+esc(r.situacao||"ATRACADO")+'</strong></td></tr>').join(""):'<tr><td colspan="7" class="empty">Nenhum navio atracado encontrado nos berços monitorados.</td></tr>';$("meta").textContent=data.length+" de "+rows.length+" navio(s) atracado(s) nos berços monitorados."}
async function carregar(){const b=$("atualizar");b.disabled=true;b.textContent="Atualizando...";$("meta").textContent="Consultando dados de navios atracados...";try{
const response=await fetch("https://www.praticagem.org.br/asp/atracados.asp",{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const html=await response.text(),doc=new DOMParser().parseFromString(html,"text/html");
let found=[];for(const tr of doc.querySelectorAll("tr")){const cells=[...tr.querySelectorAll("th,td")].map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean);if(cells.length<2)continue;const berth=cells.find(v=>(v.toUpperCase().match(/[A-Z0-9]+/g)||[]).some(t=>BERCOS.has(t)));if(!berth)continue;const shipLink=tr.querySelector("a[href*=\"marinetraffic.com\"]");const ship=shipLink?shipLink.textContent.replace(/\\s+/g," ").trim():"";if(!ship)continue;found.push({navio:ship,berco:berth,porto:berth.startsWith("RCH")?"RCH":berth.startsWith("VIX")?"VIX":berth.startsWith("PRM")?"PRM":"—",data:"—",hora:"—",tipo:"—",situacao:"ATRACADO"})}
if(!found.length)throw Error("A fonte não retornou uma tabela reconhecível com navios e berços monitorados.");rows=[...new Map(found.map(r=>[norm(r.navio+"|"+r.berco),r])).values()];render();$("rodape").innerHTML='Fonte: Praticagem Espírito Santo · <a href="https://www.praticagem.org.br/navios-atracados.html" target="_blank" rel="noopener">fonte original</a> · Consulta: '+new Date().toLocaleString("pt-BR");
}catch(e){$("meta").textContent="Não foi possível ler os dados automaticamente. O navegador pode bloquear a consulta por CORS ou a fonte pode usar conteúdo incorporado.";if(!rows.length)$("tabela").innerHTML='<tr><td colspan="7" class="empty">A fonte não pôde ser carregada diretamente neste navegador. <a href="https://www.praticagem.org.br/navios-atracados.html" target="_blank" rel="noopener">Consultar navios atracados no site oficial</a>.</td></tr>';console.error(e)}finally{b.disabled=false;b.textContent="Atualizar"}}
$("busca").addEventListener("input",render);$("atualizar").addEventListener("click",carregar);carregar();
</script></main></body></html>
